name: 每日抓取与审核

on:
  schedule:
    # GitHub Actions is busiest at the start of each hour; off-minute
    # schedules are less likely to be delayed or dropped.
    - cron: '13 23 * * *'  # 07:13 Asia/Shanghai
    - cron: '13 0 * * *'   # 08:13 Asia/Shanghai backup/catch-up
  workflow_dispatch:
    inputs:
      max_review:
        description: 合格候选上限（不保证凑满；最多分析 30 页）
        required: true
        default: '30'

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      AI_PROVIDER: deepseek
      AI_API_URL: https://api.deepseek.com/chat/completions
      AI_MODEL: deepseek-v4-flash
      AI_ENABLE_IMAGES: 'false'
      PYTHONUNBUFFERED: '1'
      AI_INPUT_CNY_PER_MILLION: '3'
      AI_OUTPUT_CNY_PER_MILLION: '9'
      AI_SOFT_BUDGET_CNY: '35'
      AI_HARD_BUDGET_CNY: '45'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装抓取依赖
        run: pip install -r pipeline/requirements.txt

      - name: 抓取未来十四天
        run: python pipeline/crawl.py --days 14 --max-review ${{ github.event_name == 'workflow_dispatch' && inputs.max_review || '10' }}

      - name: 从讲座回顾发现预告来源
        run: python pipeline/discover_sources.py

      - name: 检查月度 AI 预算
        id: budget
        run: python pipeline/budget.py >> "$GITHUB_OUTPUT"

      - name: 提交数据变化
        run: |
          git config user.name "pku-lectures-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: daily lecture update"
            git push
          fi

      - name: 创建每日审核 Issue
        run: |
          REVIEW_DATE=$(TZ=Asia/Shanghai date +%F)
          TITLE="每日讲座审核 · ${REVIEW_DATE}"
          EXISTING=$(gh issue list --state open --search "${TITLE} in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file data/review-issue.md
          elif grep -q '^### L' data/review-issue.md; then
            gh issue create --title "$TITLE" --body-file data/review-issue.md --label "lecture-review" || \
              gh issue create --title "$TITLE" --body-file data/review-issue.md
          fi

      - name: 创建来源审核 Issue
        run: |
          if grep -q '^### S' data/source-review-issue.md; then
            EXISTING=$(gh issue list --state open --search '来源发现审核 in:title' --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body-file data/source-review-issue.md
            else
              gh issue create --title "来源发现审核" --body-file data/source-review-issue.md --label "source-review" || \
                gh issue create --title "来源发现审核" --body-file data/source-review-issue.md
            fi
          fi

      - name: 提醒 AI 预算
        if: steps.budget.outputs.status != 'ok'
        run: |
          EXISTING=$(gh issue list --state open --search 'AI 月度预算提醒 in:title' --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh issue create \
              --title "AI 月度预算提醒" \
              --body "本月保守估算已使用 ¥${{ steps.budget.outputs.estimated_cny }}。35 元为软提醒；达到 45 元后抓取器会停止新的 AI 调用。"
          fi
