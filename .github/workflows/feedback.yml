name: 保存听后反馈

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  save:
    if: contains(github.event.issue.title, '[听后反馈]')
    runs-on: ubuntu-latest
    env:
      FEEDBACK_BODY: ${{ github.event.issue.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 保存五维反馈
        run: >-
          python pipeline/feedback.py
          --issue "${{ github.event.issue.number }}"
          --author "${{ github.actor }}"
          --url "${{ github.event.issue.html_url }}"
          --body "$FEEDBACK_BODY"

      - name: 提交反馈数据
        run: |
          git config user.name "pku-lectures-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feedback.json
          if ! git diff --cached --quiet; then
            git commit -m "data: store attended feedback #${{ github.event.issue.number }}"
            git push
          fi
