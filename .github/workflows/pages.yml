name: 部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Commits created with GITHUB_TOKEN do not emit another workflow-triggering
  # push event, so deploy again after workflows that can change public data.
  workflow_run:
    workflows:
      - 每日抓取与审核
      - 应用讲座审核
      - 应用 Owner 系统设置
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建静态网站
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: 整理仓库子路径资源
        run: python pipeline/prepare_pages.py

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
