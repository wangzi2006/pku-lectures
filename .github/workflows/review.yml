name: 应用来源审核

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  apply-source:
    if: >-
      github.actor == github.repository_owner &&
      (contains(github.event.issue.title, '来源发现审核') ||
       contains(github.event.issue.title, '[来源推荐]'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_COMMENT: ${{ github.event.comment.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 应用来源审核命令
        run: python pipeline/source_review.py --comment "$REVIEW_COMMENT"

      - name: 提交来源变化
        id: commit
        run: |
          git config user.name "pku-lectures-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources.json data/source-suggestions.json data/source-review-issue.md
          if ! git diff --cached --quiet; then
            git commit -m "data: apply source review #${{ github.event.issue.number }}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 回复处理结果
        if: steps.commit.outputs.changed == 'true'
        run: gh issue comment ${{ github.event.issue.number }} --body "来源审核已应用。新来源将从下一次每日抓取开始参与发现；通过固定规则筛选的讲座会自动发布。"

      - name: 刷新统一来源审核 Issue
        if: steps.commit.outputs.changed == 'true'
        run: |
          EXISTING=$(gh issue list --state open --search '来源发现审核 in:title' --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file data/source-review-issue.md
          fi
