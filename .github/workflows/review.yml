name: 应用讲座审核

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.actor == github.repository_owner &&
      contains(github.event.issue.title, '每日讲座审核')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_COMMENT: ${{ github.event.comment.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 应用审核命令
        run: python pipeline/review.py --comment "$REVIEW_COMMENT"

      - name: 提交审核结果
        id: commit
        run: |
          git config user.name "pku-lectures-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lectures.json data/candidates.json data/decisions.json
          if ! git diff --cached --quiet; then
            git commit -m "data: apply lecture review #${{ github.event.issue.number }}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 回复处理结果
        if: steps.commit.outputs.changed == 'true'
        run: gh issue comment ${{ github.event.issue.number }} --body "审核结果已写入数据；网站部署完成后会自动更新。"

  apply-source:
    if: >-
      github.actor == github.repository_owner &&
      contains(github.event.issue.title, '来源发现审核')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_COMMENT: ${{ github.event.comment.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 应用来源审核命令
        run: python pipeline/source_review.py --comment "$REVIEW_COMMENT"

      - name: 提交来源变化
        id: commit
        run: |
          git config user.name "pku-lectures-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources.json data/source-suggestions.json
          if ! git diff --cached --quiet; then
            git commit -m "data: apply source review #${{ github.event.issue.number }}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 回复处理结果
        if: steps.commit.outputs.changed == 'true'
        run: gh issue comment ${{ github.event.issue.number }} --body "来源审核已应用。新来源将从下一次每日抓取开始参与发现，但仍需讲座级人工审核。"
